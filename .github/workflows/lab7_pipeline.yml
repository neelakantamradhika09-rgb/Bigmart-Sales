
name: Lab 7 - BigMart Sales MLOps Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'config.yaml'
      - 'requirements.txt'
      - 'src/mlops_pipeline/**'
      - '.github/workflows/lab7_pipeline.yml'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Lab 7 Pipeline
        run: |
          python src/mlops_pipeline/bigmart_sales_pipeline.py
